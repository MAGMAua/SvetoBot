services:
  svetobot:
    build: .
    image: svetobot:latest
    container_name: svetobot
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: ${TZ:-Europe/Moscow}
    volumes:
      - ./config:/config:ro
      - ./data:/data
    cap_add:
      - NET_RAW          # нужен для ICMP-ping
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
